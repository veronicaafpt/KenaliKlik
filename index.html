<h2>Apa Itu Phishing?</h2>
<p>Phishing adalah tindakan penipuan yang dilakukan dengan menyamar sebagai pihak tepercaya untuk mengelabui korban agar memberikan informasi sensitif. Informasi tersebut dapat berupa nama pengguna, kata sandi, kode OTP, data perbankan, atau informasi pribadi lainnya.</p>

<h2>Apa Itu Kode OTP?</h2>
<p>OTP merupakan singkatan dari <em>One-Time Password</em>, yaitu kode verifikasi sekali pakai untuk mengonfirmasi identitas pengguna atau menyetujui tindakan tertentu. Kode ini biasanya dikirim melalui SMS, email, atau aplikasi autentikasi.</p>

<h2>Mengapa OTP Tidak Boleh Dibagikan?</h2>

 title:"Dapat Pesan Mencurigakan? Lakukan 5 Langkah Ini",
 summary:"Lima langkah sederhana dan checklist cepat sebelum kamu memercayai sebuah pesan.",
 image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=85",
 alt:"Seseorang menggunakan ponsel untuk memeriksa pesan",
 body:`
<p>Pesan singkat yang menawarkan hadiah, pemberitahuan paket, hingga peringatan masalah rekening sering muncul di ponsel kita. Sebagian pesan memang berasal dari pihak yang sah, tetapi ada juga yang digunakan untuk melakukan penipuan digital.</p>
<p>Jika menerima pesan yang terasa janggal, jangan langsung mengeklik tautan atau mengikuti instruksi di dalamnya. Berikut lima langkah untuk melindungi diri.</p>
<h2>1. Jangan Langsung Mengeklik Tautan</h2><p>Tautan dalam pesan mencurigakan dapat mengarah ke situs palsu, halaman login tiruan, atau unduhan berbahaya. Jika ada pesan tentang paket tertahan, periksa informasi pengiriman melalui aplikasi atau situs resmi kurir.</p>
<h2>2. Periksa Alamat Pengirim dan Domain</h2><p>Nama profil atau logo yang terlihat resmi tidak menjamin pengirim benar-benar berasal dari organisasi tersebut. Periksa alamat email, nomor pengirim, dan domain situs. Pelaku dapat menggunakan alamat yang menyerupai situs asli dengan mengubah ejaan atau menambahkan karakter.</p>
<h2>3. Konfirmasi Melalui Kanal Resmi</h2><p>Jika pesan mengatasnamakan bank, kurir, marketplace, atau instansi, lakukan verifikasi secara mandiri.</p><ul><li>Buka aplikasi resmi yang sudah terpasang.</li><li>Ketik alamat situs resmi langsung di browser.</li><li>Hubungi layanan pelanggan melalui informasi kontak resmi.</li><li>Periksa notifikasi di aplikasi atau akun resmi penyedia layanan.</li></ul><p>Jangan menjadikan nomor telepon atau tautan di pesan mencurigakan sebagai satu-satunya sumber verifikasi.</p>
<h2>4. Jangan Membagikan Kata Sandi atau OTP</h2><p>Jangan memberikan kata sandi, PIN, kode OTP, atau informasi pribadi kepada orang yang menghubungimu secara tiba-tiba. Jangan menyetujui permintaan login atau autentikasi yang tidak kamu lakukan.</p><p>Jika telanjur memberikan informasi sensitif, segera ganti kata sandi melalui kanal resmi, periksa aktivitas akun, dan hubungi penyedia layanan jika diperlukan.</p>
<h2>5. Laporkan dan Blokir Pesan</h2><p>Jika pesan terindikasi penipuan, simpan bukti yang diperlukan seperti tangkapan layar, nomor pengirim, atau alamat situs. Selanjutnya, gunakan fitur laporkan sebagai spam, blokir pengirim jika perlu, dan laporkan ke penyedia layanan atau platform terkait.</p><p>Jika terjadi kerugian finansial atau penyalahgunaan akun, hubungi bank atau penyedia layanan secepatnya dan gunakan kanal pelaporan resmi.</p>
<h2>Checklist Sebelum Memercayai Pesan</h2><ul><li>Apakah saya dapat memverifikasi identitas pengirim?</li><li>Apakah isi pesan membuat saya panik atau terburu-buru?</li><li>Apakah tautannya benar-benar mengarah ke situs resmi?</li><li>Apakah pesan meminta kata sandi, PIN, atau OTP?</li><li>Bisakah informasi ini dikonfirmasi melalui aplikasi resmi?</li></ul>
<div class="article-callout">Jika masih ragu, jangan lanjutkan prosesnya sebelum melakukan verifikasi.</div>
<h2>Kesimpulan</h2><p>Menghadapi pesan mencurigakan tidak harus membuat kita panik. Berhenti sejenak, periksa pengirim, verifikasi informasi, jaga data sensitif, lalu laporkan pesan yang terindikasi penipuan.</p><p><strong>Berhenti sebelum klik. Periksa sebelum percaya. Laporkan jika mencurigakan.</strong></p>`
}
];

function card(a){
 return `<article class="article-card"><div class="article-image"><img src="${a.image}" alt="${a.alt}" loading="lazy" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#d8e9e5,#a9c8d0)'"><span class="category">${a.category}</span></div><div class="article-content"><div class="article-meta">${a.date} · ${a.read}</div><h3>${a.title}</h3><p>${a.summary}</p><a class="read-link" href="#${a.id}">Baca artikel <span aria-hidden="true">→</span></a></div></article>`;
}
function home(){
 return `<section class="hero-wrap"><div class="container hero"><div><div class="eyebrow">Social campaign · keamanan digital</div><h1>Jangan asal <em>klik.</em><br>Jaga jejak digitalmu.</h1><p>KenaliKlik mengajak kita mengenali phishing, menjaga kode OTP, dan bertindak tepat saat menerima pesan mencurigakan. Satu langkah kecil bisa membantu melindungi data pribadi.</p><div class="actions"><a class="btn btn-primary" href="#artikel">Jelajahi artikel <span aria-hidden="true">→</span></a><a class="btn btn-ghost" href="#kuis">Coba kuis mini</a></div></div><div class="hero-visual"><div class="hero-photo"><img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1200&q=90" alt="Ilustrasi jaringan keamanan siber"><div class="photo-shade"></div><div class="photo-label"><small>Kenali · Periksa · Lindungi</small><h2>Keamanan digital dimulai dari kebiasaan kita.</h2></div></div></div></div></section>
 <section class="section container" id="artikel"><div class="section-head"><div><div class="kicker">Bacaan pilihan</div><h2 class="section-title">Semua Artikel</h2></div><p>Informasi praktis agar kamu lebih waspada saat menerima pesan, tautan, dan permintaan data digital.</p></div><div class="article-grid">${articles.map(card).join("")}</div></section>
 <section class="section container" style="padding-top:0"><div class="campaign-band"><div><div class="kicker">Uji kewaspadaanmu</div><h2>Phishing atau bukan?</h2><p>Coba kuis mini KenaliKlik dan lihat apakah kamu sudah tahu langkah yang aman saat menerima pesan mencurigakan.</p></div><a class="btn btn-teal" href="#kuis">Mulai kuis <span aria-hidden="true">→</span></a></div></section>`;
}
function articlePage(a){
 const idx=articles.findIndex(x=>x.id===a.id);
 const prev=idx>0?`<a href="#${articles[idx-1].id}">← Artikel sebelumnya</a>`:"<a href=\"#artikel\">← Semua artikel</a>";
 const next=idx<articles.length-1?`<a href="#${articles[idx+1].id}">Artikel berikutnya →</a>`:"<a href=\"#kuis\">Coba kuis mini →</a>";
 return `<section class="page container"><article class="article-body"><div class="article-meta">${a.category} · ${a.read}</div><h1>${a.title}</h1><p style="color:var(--muted);font-size:1.08rem">${a.summary}</p>${a.body}<div class="article-callout">KenaliKlik — Jangan Asal Klik, Lindungi Identitas Digitalmu.</div></article><div class="article-pager">${prev}${next}</div></section>`;
}
function quiz(){
 return `<section class="page container"><div class="page-intro"><div class="kicker">Kuis interaktif</div><h1>Phishing atau bukan?</h1><p>Baca skenario berikut dan pilih tindakan yang paling aman. Kuis ini untuk edukasi, bukan alat untuk memastikan suatu pesan benar-benar penipuan.</p></div><div class="quiz-box"><div class="kicker">Skenario 01 / 01</div><h2 style="color:var(--navy);margin:5px 0 0">Pesan paket tertahan</h2><div class="quiz-scenario"><div class="fake-message"><small>SMS · Pengirim tidak dikenal</small>“Paket Anda tertahan. Segera perbarui alamat melalui tautan ini agar paket tidak dikembalikan.”</div></div><p>Apa tindakan paling aman?</p><div class="quiz-options"><button class="quiz-option" data-correct="false"><b>A.</b><span>Langsung membuka tautan karena takut paket dikembalikan.</span></button><button class="quiz-option" data-correct="true"><b>B.</b><span>Mengecek status paket lewat aplikasi atau situs resmi kurir secara mandiri.</span></button><button class="quiz-option" data-correct="false"><b>C.</b><span>Membalas pesan dan mengirimkan data pribadi untuk verifikasi.</span></button></div><div class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite"></div><button class="btn btn-teal" id="quizReset" style="margin-top:15px" type="button">Ulangi kuis</button></div></section>`;
}

 return `<section class="page container"><div class="page-intro"><div class="kicker">Baca dan periksa</div><h1>Referensi Tepercaya</h1><p>Gunakan sumber resmi untuk mempelajari keamanan digital, mengenali penipuan, dan mencari panduan pelaporan. Tautan di bawah mengarah ke situs organisasi terkait.</p></div><div class="reference-list">
 <article class="reference-card"><h3>Otoritas Jasa Keuangan (OJK)</h3><p>Informasi dan edukasi konsumen sektor jasa keuangan, termasuk kewaspadaan terhadap penipuan keuangan.</p><a href="https://www.ojk.go.id/" target="_blank" rel="noopener noreferrer">Kunjungi ojk.go.id ↗</a></article>
 <article class="reference-card"><h3>Indonesia Anti-Scam Centre (IASC)</h3><p>Kanal resmi untuk informasi dan pelaporan terkait penipuan transaksi keuangan.</p><a href="https://iasc.ojk.go.id/" target="_blank" rel="noopener noreferrer">Kunjungi iasc.ojk.go.id ↗</a></article>
 <article class="reference-card"><h3>Badan Siber dan Sandi Negara (BSSN)</h3><p>Informasi, edukasi, dan publikasi terkait keamanan siber di Indonesia.</p><a href="https://www.bssn.go.id/" target="_blank" rel="noopener noreferrer">Kunjungi bssn.go.id ↗</a></article>
 <article class="reference-card"><h3>Komdigi</h3><p>Kementerian Komunikasi dan Digital Republik Indonesia, termasuk informasi kebijakan dan edukasi ruang digital.</p><a href="https://www.komdigi.go.id/" target="_blank" rel="noopener noreferrer">Kunjungi komdigi.go.id ↗</a></article>
 <article class="reference-card"><h3>Aduan Konten</h3><p>Kanal pemerintah untuk melaporkan konten internet yang diduga melanggar ketentuan.</p><a href="https://aduankonten.id/" target="_blank" rel="noopener noreferrer">Kunjungi aduankonten.id ↗</a></article>
 <article class="reference-card"><h3>Catatan penggunaan</h3><p>Artikel KenaliKlik merupakan materi edukasi kampanye. Untuk kasus nyata, ikuti instruksi terbaru dari penyedia layanan dan kanal resmi yang berwenang.</p></article>
 </div></section>`;
}
function about(){
 return `<section class="page container"><div class="page-intro"><div class="kicker">Tentang kampanye</div><h1>Lebih sadar, lebih aman.</h1><p>KenaliKlik dibuat untuk membantu pengguna internet mengenali tanda-tanda phishing dan membangun kebiasaan yang lebih aman saat beraktivitas digital.</p></div><div class="about-grid"><aside class="profile-card"><div class="profile-avatar" aria-hidden="true">V</div><h2>Veronica Febriani Putri</h2><p>Mahasiswa Statistika<br>Institut Teknologi Sepuluh Nopember (ITS)<br>NRP: 5003231121</p></aside><section class="about-copy"><div class="kicker">Latar belakang</div><h2>Mengapa KenaliKlik?</h2><p>Aktivitas digital memudahkan komunikasi dan transaksi, tetapi pesan palsu dan tautan berbahaya juga dapat dimanfaatkan untuk menipu pengguna. KenaliKlik hadir sebagai kampanye sosial sederhana untuk membantu pembaca berhenti sejenak, memeriksa informasi, dan mengambil tindakan yang lebih aman.</p><h2>Tujuan kampanye</h2><ul><li>Mengenalkan pengertian dan modus phishing.</li><li>Mendorong kebiasaan menjaga kata sandi, PIN, dan kode OTP.</li><li>Membagikan langkah praktis saat menerima pesan mencurigakan.</li><li>Mengarahkan pembaca ke sumber informasi dan pelaporan resmi.</li></ul><h2>Pesan utama</h2><p><strong>Jangan asal klik. Periksa sebelum percaya. Lindungi identitas digitalmu.</strong></p><p style="font-size:.88rem;color:var(--muted)">Proyek edukasi untuk tugas Aplikasi Teknologi dan Transformasi Digital (APTEKTRANSIDI).</p></section></div></section>`;
}
function render(){
 const hash=(location.hash||"#beranda").slice(1);
 const app=document.getElementById("app");
 const found=articles.find(a=>a.id===hash);
 document.querySelectorAll("[data-page]").forEach(el=>el.classList.toggle("active",el.dataset.page===hash || (hash==="a1"||hash==="a2"||hash==="a3")&&el.dataset.page==="artikel" || hash==="beranda"&&el.dataset.page==="beranda"));
 if(hash==="kuis")app.innerHTML=quiz();
 else if(hash==="referensi")app.innerHTML=references();
 else if(hash==="tentang")app.innerHTML=about();
 else if(found)app.innerHTML=articlePage(found);
 else app.innerHTML=home();
 document.title=found?found.title+" — KenaliKlik":({kuis:"Kuis Mini",referensi:"Referensi",tentang:"Tentang Kampanye"}[hash]||"KenaliKlik — Jangan Asal Klik");
 window.scrollTo({top:0,behavior:"instant"});
}
document.addEventListener("click",function(e){
 const opt=e.target.closest(".quiz-option");
 if(opt){
   const feedback=document.getElementById("quizFeedback");
   if(!feedback)return;
   feedback.classList.add("show");
   if(opt.dataset.correct==="true"){feedback.innerHTML="<strong>Benar!</strong> Periksa status paket melalui aplikasi atau situs resmi kurir yang kamu buka sendiri. Jangan langsung percaya pada tautan dari pesan.";}
   else{feedback.innerHTML="<strong>Belum tepat.</strong> Jangan terburu-buru mengeklik atau membagikan data. Verifikasi informasi melalui kanal resmi yang kamu buka secara mandiri.";}
   document.querySelectorAll(".quiz-option").forEach(b=>b.disabled=true);
 }
 if(e.target.closest("#quizReset")){render();}
});
window.addEventListener("hashchange",render);
if(!location.hash)history.replaceState(null,"",location.pathname+location.search+"#beranda");
render();
</script>
